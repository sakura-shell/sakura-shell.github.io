<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI判定の学習と評価</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; color: #222; max-width: 960px; }
  fieldset { border: 1px solid #ccc; border-radius: 8px; margin: 12px 0; }
  label { display: block; margin: 4px 0; }
  button { font-size: 16px; padding: 8px 16px; margin: 4px 8px 4px 0; }
  pre { background: #f6f6f6; padding: 8px; white-space: pre-wrap; font-size: 13px; }
  table { border-collapse: collapse; font-size: 12px; }
  td, th { border: 1px solid #ccc; padding: 2px 6px; text-align: center; }
  .ok { background: #dfd; } .ng { background: #fdd; }
  .note { font-size: 13px; color: #555; }
</style>
</head>
<body>
<h1>AI判定の学習と評価（開発用）</h1>
<p class="note">写真から取り出した特徴（MobileNet）を使って、36種類（＋36種類以外）を見分ける分類器を学習します。すべてこのパソコンのブラウザの中で動きます。手順は README の「AI判定を学習させる」を参照。</p>

<fieldset>
  <legend>学習に使う写真</legend>
  <label><input type="checkbox" id="useCatalog" checked> 図鑑の写真（site/data/shells.json の photos）</label>
  <label><input type="checkbox" id="useTraining" checked> 学習用の写真（training/manifest.json。<code>python3 tools/make_training_manifest.py</code> で作る）</label>
  <label>1枚あたりの水増し（向き・大きさ・明るさ・背景を変えた画像）: <select id="aug"><option>4</option><option selected>12</option><option>24</option></select></label>
</fieldset>
<fieldset>
  <legend>評価</legend>
  <label><input type="checkbox" id="useVal" checked> 学習用の写真のうち「評価」に分けた個体で評価する（学習には使わない）</label>
  <label><input type="checkbox" id="useBox" checked> 完成見本の箱の写真（references/box_sample.jpeg）の各マスで評価する（各マスに正解の貝が入っている実物写真）</label>
</fieldset>
<button id="run">学習して評価する</button>
<button id="save" disabled>サイトに保存する</button>
<pre id="log">待機中</pre>
<div id="report"></div>
<script type="module" src="train.js"></script>
</body>
</html>
